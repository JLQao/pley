<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجلس الأحكام الملكي - VIP</title>
    <!-- مكتبة قاعدة البيانات الحية المفتوحة (MQTT) المضمونة 100% -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root {
            --bg: #07050a;
            --panel: rgba(23, 16, 38, 0.95);
            --gold: #f7d070;
            --gold-dark: #c8963e;
            --red: #ff2a5f;
            --green: #00f0b5;
            --text: #ffffff;
            --border: rgba(247, 208, 112, 0.25);
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; }
        body { 
            background: radial-gradient(circle at center, #1b102e 0%, var(--bg) 100%); 
            color: var(--text); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 15px; 
        }

        .card { 
            background: var(--panel); 
            backdrop-filter: blur(16px);
            border: 1px solid var(--border); 
            border-radius: 28px; 
            padding: 30px 25px; 
            width: 100%; 
            max-width: 450px; 
            text-align: center; 
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(247, 208, 112, 0.1); 
            position: relative; 
        }

        .card::before { 
            content: ''; 
            position: absolute; 
            top: 0; left: 0; right: 0; 
            height: 4px; 
            background: linear-gradient(90deg, transparent, var(--gold), transparent); 
        }

        h1 { 
            font-size: 26px; 
            font-weight: 900; 
            background: linear-gradient(180deg, #ffffff 30%, var(--gold) 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            margin-bottom: 4px; 
        }
        .subtitle { color: #8e83ab; font-size: 13px; margin-bottom: 22px; }

        input { 
            width: 100%; 
            padding: 15px; 
            border-radius: 16px; 
            border: 1px solid rgba(247, 208, 112, 0.2); 
            background: rgba(10, 6, 18, 0.8); 
            color: #fff; 
            font-size: 15px; 
            text-align: center; 
            outline: none; 
            margin-bottom: 12px; 
        }
        input:focus { border-color: var(--gold); }

        .btn-group { display: flex; gap: 10px; margin-bottom: 10px; }

        button { 
            width: 100%; 
            padding: 16px; 
            border-radius: 16px; 
            border: none; 
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%); 
            color: #0d0814; 
            font-size: 15px; 
            font-weight: 800; 
            cursor: pointer; 
            box-shadow: 0 6px 20px rgba(247, 208, 112, 0.25); 
            transition: all 0.3s;
            margin-top: 5px;
        }
        button.secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid var(--border);
            box-shadow: none;
            margin-top: 0;
        }
        button:disabled { background: #1e172e !important; color: #584b73 !important; box-shadow: none !important; cursor: not-allowed; }

        .room-badge {
            background: rgba(247, 208, 112, 0.1);
            border: 1px dashed var(--gold);
            color: var(--gold);
            padding: 10px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .list-box { 
            background: rgba(10, 6, 18, 0.7); 
            border-radius: 18px; 
            padding: 18px; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            margin: 18px 0; 
            text-align: right; 
        }
        .list-title { font-size: 13px; color: #a497c6; margin-bottom: 12px; display: flex; justify-content: space-between; }
        ul { list-style: none; max-height: 150px; overflow-y: auto; }
        li { padding: 10px 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.03); display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        li:last-child { border: none; }
        
        .tag { font-size: 11px; padding: 4px 10px; border-radius: 8px; background: rgba(0, 240, 181, 0.15); color: var(--green); border: 1px solid rgba(0, 240, 181, 0.3); }

        .res-card { 
            padding: 16px; 
            border-radius: 16px; 
            margin: 12px 0; 
            font-weight: 800; 
            text-align: right; 
            display: flex; 
            justify-content: space-between; 
            font-size: 16px; 
        }
        .king { background: linear-gradient(90deg, #f7d070, #e0a938); color: #120b1f; }
        .victim { background: linear-gradient(90deg, #ff2a5f, #bf133d); color: #fff; }
        .witness { background: linear-gradient(90deg, #2a9df4, #1260cc); color: #fff; }

        .footer { margin-top: 22px; font-size: 12px; color: #5d527a; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px; }
        .footer b { color: var(--gold); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="card">
    <h1>🏛️ مجلس الأحكام الملكي</h1>
    <div class="subtitle">منصة الاقتراع والقرعة المباشرة عبر الدول</div>

    <!-- 1. شاشة الدخول والرمز -->
    <div id="sec-join">
        <input type="text" id="username" placeholder="أدخل اسمك الكريم..." maxlength="15">
        <input type="number" id="room-code-input" placeholder="رمز المجلس (مثال: 4821)" maxlength="6">
        
        <div class="btn-group">
            <button onclick="createRoom()">إنشاء مجلس جديد 👑</button>
            <button class="secondary" onclick="joinRoom()">انضمام بالرمز 🔗</button>
        </div>
    </div>

    <!-- 2. مجلس الانتظار -->
    <div id="sec-lobby" class="hidden">
        <div class="room-badge">
            رمز المجلس: <span id="display-room-code">----</span>
        </div>

        <div class="list-box">
            <div class="list-title">
                <span>أعضاء المجلس الحاضرون:</span>
                <b id="p-count">0</b>
            </div>
            <ul id="p-list"></ul>
        </div>

        <!-- زر خاص برئيس المجلس فقط لبدء القرعة -->
        <button id="start-btn" onclick="startDraw()" class="hidden">بدء سحب القرعة 🎲</button>
        <div id="waiting-msg" style="color:#8e83ab; font-size:14px; margin-top:10px;">بانتظار أن يبدأ رئيس المجلس القرعة... ⏳</div>
    </div>

    <!-- 3. شاشة إعلان الأحكام -->
    <div id="sec-result" class="hidden">
        <h3 style="color:var(--gold); margin-bottom:15px; font-size:20px;">📜 صدر الحكم الملكي 📜</h3>
        <div class="res-card king"><span>👑 جلالة الحاكم:</span> <span id="r-king">-</span></div>
        <div class="res-card victim"><span>🎯 المحكوم عليه:</span> <span id="r-victim">-</span></div>
        <div class="res-card witness"><span>👁️ الشاهد الملكي:</span> <span id="r-witness">-</span></div>
        <button onclick="location.reload()" style="margin-top:20px;">جلسة جديدة 🔄</button>
    </div>

    <div class="footer">صُممت الفخامة بحقوق <b>وضاح</b> © 2026</div>
</div>

<script>
    let client = null;
    let myName = "";
    let roomTopic = "";
    let isHost = false;
    let players = [];

    // دالة الاتصال بقاعدة البيانات المفتوحة
    function connectDB(code, onConnectCallback) {
        // الاتصال بسيرفر EMQX العالمي الموثوق والذي لا يحتاج مفاتيح
        client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

        roomTopic = 'vip_rulers_room_' + code;

        client.on('connect', () => {
            client.subscribe(roomTopic);
            if (onConnectCallback) onConnectCallback();
        });

        client.on('message', (topic, message) => {
            const data = JSON.parse(message.toString());

            // إذا أرسل شخص طلب انضمام والرئيس موجود
            if (data.type === 'JOIN_REQ' && isHost) {
                if (!players.includes(data.name)) {
                    players.push(data.name);
                }
                updateUI();
                // الرئيس يحدث القائمة لجميع الأعضاء
                client.publish(roomTopic, JSON.stringify({ type: 'SYNC_PLAYERS', players: players }));
            } 
            // استقبال القائمة المحدثة (للأعضاء)
            else if (data.type === 'SYNC_PLAYERS') {
                players = data.players;
                updateUI();
            } 
            // استقبال نتيجة القرعة
            else if (data.type === 'DRAW_RESULTS') {
                showResults(data.results);
            }
        });

        client.on('error', () => {
            alert("حدث خطأ في الاتصال، يرجى المحاولة مرة أخرى.");
        });
    }

    function createRoom() {
        myName = document.getElementById("username").value.trim();
        if (!myName) return alert("يرجى إدخال اسمك الكريم أولاً!");

        const randomCode = Math.floor(1000 + Math.random() * 9000).toString();
        isHost = true;

        connectDB(randomCode, () => {
            document.getElementById("sec-join").classList.add("hidden");
            document.getElementById("sec-lobby").classList.remove("hidden");
            document.getElementById("display-room-code").innerText = randomCode;
            document.getElementById("start-btn").classList.remove("hidden");
            document.getElementById("waiting-msg").classList.add("hidden");

            // إضافة اسم الرئيس للقائمة وبثها
            players.push(myName);
            updateUI();
            client.publish(roomTopic, JSON.stringify({ type: 'SYNC_PLAYERS', players: players }));
        });
    }

    function joinRoom() {
        myName = document.getElementById("username").value.trim();
        const code = document.getElementById("room-code-input").value.trim();

        if (!myName) return alert("يرجى إدخال اسمك الكريم!");
        if (!code) return alert("يرجى كتابة رمز المجلس للانضمام!");

        connectDB(code, () => {
            document.getElementById("sec-join").classList.add("hidden");
            document.getElementById("sec-lobby").classList.remove("hidden");
            document.getElementById("display-room-code").innerText = code;

            // إرسال الاسم لقاعدة البيانات ليضيفه الرئيس
            client.publish(roomTopic, JSON.stringify({ type: 'JOIN_REQ', name: myName }));
        });
    }

    function updateUI() {
        const ul = document.getElementById("p-list");
        ul.innerHTML = "";
        document.getElementById("p-count").innerText = players.length;

        players.forEach(p => {
            const li = document.createElement("li");
            li.innerHTML = `<span>${p}</span> <span class="tag">متصل 👑</span>`;
            ul.appendChild(li);
        });
    }

    function startDraw() {
        if (players.length < 3) {
            return alert("يجب أن يكون عدد الحاضرين 3 لاعبين على الأقل لبدء القرعة!");
        }

        // عشوائية الأسماء
        const shuffled = [...players].sort(() => 0.5 - Math.random());
        const results = { king: shuffled[0], victim: shuffled[1], witness: shuffled[2] };

        // إرسال النتيجة عبر قاعدة البيانات
        client.publish(roomTopic, JSON.stringify({ type: 'DRAW_RESULTS', results: results }));
    }

    function showResults(results) {
        document.getElementById("sec-lobby").classList.add("hidden");
        document.getElementById("sec-result").classList.remove("hidden");

        document.getElementById("r-king").innerText = results.king;
        document.getElementById("r-victim").innerText = results.victim;
        document.getElementById("r-witness").innerText = results.witness;
    }
</script>

</body>
</html>
