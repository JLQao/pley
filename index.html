<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الأحكام - VIP</title>
    <!-- مكتبة السيرفر المباشر الشغال 100% -->
    <script src="https://cdn.scaledrone.com/scaledrone.min.js"></script>
    <style>
        :root {
            --bg: #0d0914;
            --panel: #171026;
            --accent: #9d4edd;
            --gold: #ffb703;
            --red: #ff0055;
            --green: #06d6a0;
            --text: #ffffff;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }

        .card { background: var(--panel); border: 2px solid #2a1b4e; border-radius: 24px; padding: 25px; width: 100%; max-width: 440px; text-align: center; box-shadow: 0 10px 40px rgba(157, 78, 221, 0.2); position: relative; }
        .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, var(--gold), var(--accent), var(--red)); border-radius: 24px 24px 0 0; }

        h1 { font-size: 28px; font-weight: 900; background: linear-gradient(45deg, var(--gold), #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }
        .subtitle { color: #a093c4; font-size: 13px; margin-bottom: 20px; }

        .status-bar { background: #0f0a1c; border-radius: 12px; padding: 8px 12px; font-size: 12px; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 15px; border: 1px solid #281a42; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff4757; }
        .dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }

        input { width: 100%; padding: 15px; border-radius: 14px; border: 2px solid #2d1d52; background: #0a0612; color: #fff; font-size: 16px; text-align: center; outline: none; margin-bottom: 12px; }
        input:focus { border-color: var(--accent); }

        button { width: 100%; padding: 15px; border-radius: 14px; border: none; background: linear-gradient(45deg, var(--accent), #7b2cbf); color: white; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(157, 78, 221, 0.4); margin-bottom: 10px; }
        button:disabled { background: #261c3b !important; color: #66528c !important; box-shadow: none !important; cursor: not-allowed; }

        .list-box { background: #0a0612; border-radius: 16px; padding: 15px; border: 1px solid #281a42; margin: 15px 0; text-align: right; }
        .list-title { font-size: 13px; color: #a093c4; margin-bottom: 10px; display: flex; justify-content: space-between; }
        ul { list-style: none; max-height: 140px; overflow-y: auto; }
        li { padding: 8px 12px; border-bottom: 1px solid #1a1030; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        li:last-child { border: none; }
        .tag { font-size: 11px; padding: 3px 8px; border-radius: 6px; background: #261c3b; color: #aaa; }
        .tag.ready { background: rgba(6, 214, 160, 0.2); color: var(--green); border: 1px solid var(--green); }

        .timer-display { font-size: 20px; font-weight: bold; color: var(--gold); margin: 15px 0; background: rgba(255, 183, 3, 0.1); padding: 10px; border-radius: 12px; border: 1px dashed var(--gold); }

        .res-card { padding: 15px; border-radius: 14px; margin: 10px 0; font-weight: bold; text-align: right; display: flex; justify-content: space-between; font-size: 16px; }
        .king { background: linear-gradient(90deg, #ffb703, #fb8500); color: #000; }
        .victim { background: linear-gradient(90deg, #ff0055, #ff5000); color: #fff; }
        .witness { background: linear-gradient(90deg, #7209b7, #4cc9f0); color: #fff; }

        .footer { margin-top: 20px; font-size: 12px; color: #66528c; border-top: 1px solid #23163d; padding-top: 12px; }
        .footer b { color: var(--gold); }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="card">
    <h1>🎲 لعبة الأحكام الملكية</h1>
    <div class="subtitle">غرفة اللعب الجماعية التفاعلية</div>

    <div class="status-bar">
        <div id="net-dot" class="dot"></div>
        <span id="net-text">جاري الاتصال بالسيرفر...</span>
    </div>

    <!-- 1. شاشة الدخول -->
    <div id="sec-join">
        <input type="text" id="username" placeholder="اكتب اسمك الفخم هنا..." maxlength="15">
        <button id="join-btn" onclick="joinGame()" disabled>انضمام للغرفة</button>
    </div>

    <!-- 2. غرفة الانتظار -->
    <div id="sec-lobby" class="hidden">
        <div class="list-box">
            <div class="list-title">
                <span>اللاعبون المنضمون:</span>
                <b id="p-count">0</b>
            </div>
            <ul id="p-list"></ul>
        </div>

        <div id="timer-box" class="timer-display hidden">
            ⏳ تبدأ القرعة خلال: <span id="sec">30</span> ثانية
        </div>

        <button id="ready-btn" onclick="markReady()">أنا جاهز للبدء 👍</button>
    </div>

    <!-- 3. النتيجة -->
    <div id="sec-result" class="hidden">
        <h3 style="color:var(--gold); margin-bottom:15px;">🎉 أكتملت القرعة بنجاح 🎉</h3>
        <div class="res-card king"><span>👑 الحاكم:</span> <span id="r-king">-</span></div>
        <div class="res-card victim"><span>🎯 المحكوم عليه:</span> <span id="r-victim">-</span></div>
        <div class="res-card witness"><span>👁️ الشاهد:</span> <span id="r-witness">-</span></div>
        <button onclick="location.reload()" style="margin-top:15px;">جولة جديدة 🔄</button>
    </div>

    <div class="footer">حقوق اللعبة محفوظة لـ <b>وضاح</b> © 2026</div>
</div>

<script>
    // سيرفر Scaledrone المباشر والسريع جداً
    const CHANNEL_ID = 'yj5y83gS5S8uJ6Qd'; 
    let drone = null;
    let room = null;
    let myName = "";
    let membersList = {};

    // 1. الاتصال المباشر بالسيرفر
    drone = new Scaledrone(CHANNEL_ID);

    drone.on('open', error => {
        if (error) return console.error(error);
        document.getElementById("net-dot").classList.add("online");
        document.getElementById("net-text").innerText = "متصل بالسيرفر المباشر ✅";
        document.getElementById("join-btn").disabled = false;
    });

    function joinGame() {
        myName = document.getElementById("username").value.trim();
        if (!myName) return alert("اكتب اسمك أولاً!");

        document.getElementById("sec-join").classList.add("hidden");
        document.getElementById("sec-lobby").classList.remove("hidden");

        // الاشتراك في الغرفة العامة
        room = drone.subscribe('observable-rulers-room');

        room.on('open', error => {
            if (error) console.error(error);
        });

        // قائمة المتواجدين الحالية
        room.on('members', members => {
            members.forEach(m => {
                if (m.clientData) membersList[m.id] = m.clientData;
            });
            // إضافة نفسي
            drone.publish({
                room: 'observable-rulers-room',
                message: { type: 'JOIN', name: myName }
            });
        });

        // عند دخول شخص جديد
        room.on('member_join', member => {
            // إرسال بياني له
            drone.publish({
                room: 'observable-rulers-room',
                message: { type: 'SYNC', name: myName }
            });
        });

        // الاستماع للرسائل بين الجوالات
        room.on('data', (data, member) => {
            if (data.type === 'JOIN' || data.type === 'SYNC') {
                membersList[member.id] = { name: data.name, ready: false };
                updateUI();
            } else if (data.type === 'READY') {
                if (membersList[member.id]) membersList[member.id].ready = true;
                updateUI();
                checkAllReady();
            } else if (data.type === 'START_TIMER') {
                startCountdown();
            } else if (data.type === 'WINNERS') {
                showResults(data.roles);
            }
        });
    }

    function updateUI() {
        const ul = document.getElementById("p-list");
        ul.innerHTML = "";
        const keys = Object.keys(membersList);
        document.getElementById("p-count").innerText = keys.length;

        keys.forEach(k => {
            const m = membersList[k];
            const li = document.createElement("li");
            li.innerHTML = `<span>${m.name}</span> <span class="tag ${m.ready ? 'ready' : ''}">${m.ready ? 'جاهز ✅' : 'ينتظر ⏳'}</span>`;
            ul.appendChild(li);
        });
    }

    function markReady() {
        document.getElementById("ready-btn").disabled = true;
        document.getElementById("ready-btn").innerText = "بانتظار موافقة البقية...";
        drone.publish({
            room: 'observable-rulers-room',
            message: { type: 'READY' }
        });
    }

    function checkAllReady() {
        const keys = Object.keys(membersList);
        const allReady = keys.length >= 3 && keys.every(k => membersList[k].ready);
        
        // الأبكر يقوم بإرسال أمر بدء التنازلي للجميع
        if (allReady && keys[0] === drone.clientId) {
            drone.publish({
                room: 'observable-rulers-room',
                message: { type: 'START_TIMER' }
            });
        }
    }

    let timerStarted = false;
    function startCountdown() {
        if (timerStarted) return;
        timerStarted = true;

        document.getElementById("timer-box").classList.remove("hidden");
        let left = 30;

        const t = setInterval(() => {
            left--;
            document.getElementById("sec").innerText = left;

            if (left <= 0) {
                clearInterval(t);
                
                // حساب القرعة وإرسال النتائج
                const keys = Object.keys(membersList);
                if (keys[0] === drone.clientId) {
                    const shuffled = keys.map(k => membersList[k].name).sort(() => 0.5 - Math.random());
                    drone.publish({
                        room: 'observable-rulers-room',
                        message: {
                            type: 'WINNERS',
                            roles: { king: shuffled[0], victim: shuffled[1], witness: shuffled[2] }
                        }
                    });
                }
            }
        }, 1000);
    }

    function showResults(roles) {
        document.getElementById("sec-lobby").classList.add("hidden");
        document.getElementById("sec-result").classList.remove("hidden");

        document.getElementById("r-king").innerText = roles.king;
        document.getElementById("r-victim").innerText = roles.victim;
        document.getElementById("r-witness").innerText = roles.witness;
    }
</script>

</body>
</html>
